<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Лента команды · Фея Автоматизации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF9FC;
    --card: #FFFFFF;
    --lavender: #B794F4;
    --lavender-deep: #8B5CF6;
    --lavender-ink: #5B3FA0;
    --peach: #FBD38D;
    --peach-deep: #F6AD55;
    --ink: #2D3748;
    --ink-soft: #718096;
    --line: #E8E3F5;
    --mint: #68D391;
    --red: #C53030;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(60% 50% at 12% 0%, rgba(183,148,244,0.10), transparent 60%),
      radial-gradient(50% 40% at 100% 20%, rgba(251,211,141,0.14), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:300;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}

  header.nav{
    border-bottom:1px solid var(--line);
    background:rgba(251,249,252,0.85);
    backdrop-filter: blur(10px);
    position:sticky; top:0; z-index:10;
  }
  .nav-inner{
    max-width:640px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:18px;
    color:var(--lavender-ink);
  }
  .brand b{ font-style:normal; font-weight:600; }
  .nav-links{ display:flex; gap:16px; font-size:12.5px; }
  .nav-links a{ color:var(--ink-soft); text-decoration:none; }
  .nav-links a:hover{ color:var(--lavender-ink); }

  main{ max-width:640px; margin:0 auto; padding:40px 20px 60px; }

  .kicker{
    font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--lavender-ink); font-weight:500; margin-bottom:10px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:28px;
    margin-bottom:8px;
  }
  .lead{ color:var(--ink-soft); font-size:14.5px; margin-bottom:28px; }

  /* ---- gate (token entry) ---- */
  .gate-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 32px;
    box-shadow: 0 30px 60px -30px rgba(91,63,160,0.30);
    max-width:440px;
  }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:500; margin-bottom:8px; }
  .field input{
    width:100%; border:1.5px solid var(--line); border-radius:14px;
    padding:14px 16px; font-family:'Inter',sans-serif; font-size:15px;
    background:#FDFCFE; color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--lavender-deep); box-shadow:0 0 0 4px rgba(183,148,244,0.18); }
  .gate-btn, .refresh-btn{
    background: linear-gradient(100deg, var(--lavender-deep), #A579EF 55%, var(--peach-deep));
    color:#fff; border:none; border-radius:100px; padding:14px 26px;
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500; cursor:pointer;
    box-shadow: 0 14px 30px -10px rgba(139,92,246,0.5);
  }
  .gate-error{
    margin-top:14px; padding:12px 16px; border-radius:12px; font-size:13px;
    background: rgba(245,101,101,0.10); color:var(--red); border:1px solid rgba(245,101,101,0.3);
    display:none;
  }

  /* ---- feed ---- */
  #feed{ display:none; }
  .feed-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .feed-toolbar .refresh-btn{ padding:9px 18px; font-size:13px; }
  .msg-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 22px;
    margin-bottom:14px;
    box-shadow: 0 12px 24px -16px rgba(45,55,72,0.15);
  }
  .msg-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--ink-soft); margin-bottom:8px;
  }
  .msg-sender{ font-weight:500; color:var(--lavender-ink); }
  .msg-text{ font-size:15px; white-space:pre-wrap; }
  .msg-footer{ display:flex; justify-content:flex-end; margin-top:12px; }
  .copy-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:#FDFCFE; border:1.5px solid var(--line); color:var(--lavender-ink);
    border-radius:100px; padding:7px 14px; font-family:'Inter',sans-serif;
    font-size:12.5px; font-weight:500; cursor:pointer; transition: all .15s ease;
  }
  .copy-btn:hover{ border-color:var(--lavender-deep); background:rgba(183,148,244,0.08); }
  .copy-btn.copied{ border-color:var(--mint); color:#2F855A; background:rgba(104,211,145,0.10); }
  .empty-state{ color:var(--ink-soft); font-size:14px; padding:24px 0; }

  footer{ text-align:center; padding:20px; font-size:11.5px; color:var(--ink-soft); }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">Фея <b>Автоматизации</b> · команда</div>
    <div class="nav-links">
      <a href="komanda-rassylka-forma.html">Написать рассылку</a>
      <a href="komanda-podklyuchit-rassylku.html">Подключить</a>
    </div>
  </div>
</header>

<main>
  <div class="kicker">🔒 Закрытая лента</div>
  <h1>Лента команды</h1>
  <p class="lead">Здесь появляются все сообщения, отправленные командной рассылкой.</p>

  <div class="gate-card" id="gate">
    <div class="field">
      <label for="boardToken">Токен доступа к ленте</label>
      <input type="password" id="boardToken" placeholder="Токен из настройки n8n">
    </div>
    <button class="gate-btn" id="gateBtn">Открыть ленту</button>
    <div class="gate-error" id="gateError">Неверный токен или лента ещё не настроена в n8n.</div>
  </div>

  <div id="feed">
    <div class="feed-toolbar">
      <span style="font-size:13px; color:var(--ink-soft);" id="feedCount"></span>
      <button class="refresh-btn" id="refreshBtn">Обновить</button>
    </div>
    <div id="messages"></div>
  </div>
</main>

<footer>Внутренний инструмент команды · Фея Автоматизации</footer>

<script>
  // ====== ВАЖНО: подставь сюда реальный webhook-URL из n8n (team-board-webhook) ======
  const WEBHOOK_URL = "ЗАМЕНИТЬ-НА-РЕАЛЬНЫЙ-N8N-ВЕБХУК/team/board";

  const gate = document.getElementById('gate');
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');
  const boardTokenInput = document.getElementById('boardToken');
  const feed = document.getElementById('feed');
  const messagesEl = document.getElementById('messages');
  const feedCount = document.getElementById('feedCount');
  const refreshBtn = document.getElementById('refreshBtn');

  // Копирует текст в буфer обмена; в небезопасном контексте (не https/localhost)
  // Clipboard API недоступен — тогда используем запасной способ через textarea.
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  function renderMessages(messages) {
    messagesEl.innerHTML = '';
    if (!messages || messages.length === 0) {
      messagesEl.innerHTML = '<div class="empty-state">Пока ни одной рассылки — как только кто-то отправит сообщение, оно появится здесь.</div>';
      feedCount.textContent = '';
      return;
    }
    feedCount.textContent = messages.length + (messages.length === 1 ? ' сообщение' : ' сообщений');
    messages.forEach(m => {
      const card = document.createElement('div');
      card.className = 'msg-card';
      const date = m.sentAt ? new Date(m.sentAt).toLocaleString('ru-RU') : '';
      card.innerHTML = `
        <div class="msg-meta"><span class="msg-sender"></span><span></span></div>
        <div class="msg-text"></div>
        <div class="msg-footer"><button type="button" class="copy-btn"><span class="copy-label">📋 Копировать</span></button></div>
      `;
      card.querySelector('.msg-sender').textContent = m.sentBy || '—';
      card.querySelectorAll('.msg-meta span')[1].textContent = date;
      card.querySelector('.msg-text').textContent = m.text || '';

      const copyBtn = card.querySelector('.copy-btn');
      const copyLabel = card.querySelector('.copy-label');
      copyBtn.addEventListener('click', async () => {
        try {
          await copyText(m.text || '');
          copyBtn.classList.add('copied');
          copyLabel.textContent = '✓ Скопировано';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyLabel.textContent = '📋 Копировать';
          }, 1500);
        } catch (err) {
          copyLabel.textContent = 'Не удалось скопировать';
          setTimeout(() => { copyLabel.textContent = '📋 Копировать'; }, 1500);
        }
      });

      messagesEl.appendChild(card);
    });
  }

  async function loadBoard(token) {
    if (WEBHOOK_URL.includes('ЗАМЕНИТЬ-НА-РЕАЛЬНЫЙ-N8N-ВЕБХУК')) {
      console.warn('Webhook URL не настроен. Замени WEBHOOK_URL в <script> на реальный URL из n8n.');
      throw new Error('webhook_not_configured');
    }
    const response = await fetch(WEBHOOK_URL, {
      headers: { 'X-Board-Token': token }
    });
    if (!response.ok) throw new Error('unauthorized');
    const data = await response.json();
    return data.messages || [];
  }

  async function openWithToken(token) {
    gateError.style.display = 'none';
    try {
      const messages = await loadBoard(token);
      localStorage.setItem('boardViewToken', token);
      gate.style.display = 'none';
      feed.style.display = 'block';
      renderMessages(messages);
    } catch (err) {
      gateError.style.display = 'block';
    }
  }

  gateBtn.addEventListener('click', () => {
    const token = boardTokenInput.value.trim();
    if (token) openWithToken(token);
  });

  refreshBtn.addEventListener('click', () => {
    const token = localStorage.getItem('boardViewToken');
    if (token) openWithToken(token);
  });

  // Автоматически пробуем ранее сохранённый токен
  const savedToken = localStorage.getItem('boardViewToken');
  if (savedToken) {
    boardTokenInput.value = savedToken;
    openWithToken(savedToken);
  }
</script>

</body>
</html>
